# Project
version=0.1.0
group=com.duks.ga4
description=A Kotlin Multiplatform library for Google Analytics 4 (GA4) integration

# Publishing
POM_DEVELOPER_ID=duks
POM_DEVELOPER_NAME=DUKS Team
POM_NAME=duks-ga4
POM_DESCRIPTION=A Kotlin Multiplatform library for Google Analytics 4 (GA4) integration with privacy-first features
POM_URL=https://github.com/duks/duks-ga4
POM_SCM_URL=https://github.com/duks/duks-ga4
POM_SCM_CONNECTION=scm:git@github.com:duks/duks-ga4.git
POM_SCM_DEV_CONNECTION=scm:git@github.com:duks/duks-ga4.git
POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#dokka v2
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
